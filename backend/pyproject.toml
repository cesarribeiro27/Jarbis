[project]
name = "jarbis-backend"
version = "0.1.0"
description = "Jarbis - Plataforma de Inteligência de Mídia"
requires-python = ">=3.12"

dependencies = [
    # Framework web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    "python-multipart>=0.0.9",

    # Banco de dados
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Validação e configuração
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-core>=2.18.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",

    # Autenticação
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",

    # Cache e rate limit
    "redis>=5.0.0",
    "slowapi>=0.1.9",

    # HTTP e comunicação
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "certifi>=2024.0.0",

    # IA e billing
    "anthropic>=0.40.0",
    "stripe>=10.0.0",
    "twilio>=9.0.0",

    # ClickHouse (banco de eventos de links)
    "clickhouse-connect>=0.7.0",

    # GeoIP (lookup offline de país/cidade a partir de IP)
    "geoip2>=4.8.0",

    # 2FA TOTP
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",

    # Utilitários
    "python-slugify>=8.0.0",
    "pendulum>=3.0.0",
    "openpyxl>=3.1.0",
    "simpleeval>=0.9.13",
    "aiomysql>=0.2.0",
    "PyYAML>=6.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "factory-boy>=3.3.0",
    "Faker>=20.0.0",
    "coverage>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
