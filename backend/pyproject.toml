[project]
name = "lumetra-backend"
version = "0.1.0"
description = "Lumetra - Plataforma de Inteligência de Mídia"
requires-python = ">=3.12"

dependencies = [
    # Framework web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Banco de dados
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # Driver async para PostgreSQL
    "psycopg2-binary>=2.9.9",   # Driver sync (usado pelo Alembic)

    # Validação e configuração
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Autenticação
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Cache
    "redis>=5.0.0",

    # Utilitários
    "httpx>=0.27.0",             # HTTP client (testes e integrações)
    "python-slugify>=8.0.0",
    "pendulum>=3.0.0",           # Manipulação de datas com timezone BR
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
