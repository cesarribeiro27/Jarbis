<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 48 48" fill="none">
  <!-- Fundo -->
  <rect width="48" height="48" rx="13" fill="#0B0A1A"/>
  <!-- Órbita sutil -->
  <circle cx="24" cy="24" r="14" stroke="#6D28D9" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.2"/>
  <!-- Rastros planos (sem gradiente — compatibilidade email) -->
  <path d="M36,17 A14,14 0 0,0 24,10" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M24,38 A14,14 0 0,0 36,31" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M12,17 A14,14 0 0,0 12,31" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- ∴ Apex -->
  <circle cx="24" cy="10" r="2.6" fill="#A78BFA"/>
  <circle cx="24" cy="10" r="1.2" fill="white"/>
  <!-- ∴ Base direita -->
  <circle cx="36" cy="31" r="2.2" fill="#7C3AED"/>
  <circle cx="36" cy="31" r="1" fill="rgba(255,255,255,0.8)"/>
  <!-- ∴ Base esquerda -->
  <circle cx="12" cy="31" r="2.2" fill="#7C3AED"/>
  <circle cx="12" cy="31" r="1" fill="rgba(255,255,255,0.8)"/>
</svg>
